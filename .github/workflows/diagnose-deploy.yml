name: Diagnose current deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-deploy.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_SHA: 7a357822767fdb7d3e7d76449e1d8982d40c458b
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0

      - name: Collect sanitized deploy details
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _diagnostics /tmp/deploy-logs

          for attempt in $(seq 1 60); do
            runs_json=$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=20")
            run_id=$(jq -r '
              .workflow_runs
              | map(select(.path == ".github/workflows/deploy.yml" or .name == "Validate and Deploy Worker"))
              | sort_by(.created_at)
              | reverse
              | .[0].id // empty
            ' <<<"$runs_json")
            status=$(jq -r --argjson run_id "${run_id:-0}" '.workflow_runs | map(select(.id == $run_id)) | .[0].status // empty' <<<"$runs_json")
            if [[ -n "$run_id" && "$status" == completed ]]; then
              break
            fi
            sleep 5
          done

          if [[ -z "${run_id:-}" ]]; then
            {
              echo "No deploy run found for ${TARGET_SHA}."
              echo
              echo "$runs_json" | jq '{total_count, workflow_runs: [.workflow_runs[] | {id,name,path,status,conclusion,event,head_sha,created_at,html_url}]}'
            } > "_diagnostics/deploy-${TARGET_SHA}.txt"
          else
            run_json=$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")
            jobs_json=$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")

            log_status=unavailable
            if gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/logs" > /tmp/deploy-logs.zip 2>/tmp/log-download-error.txt; then
              if unzip -q /tmp/deploy-logs.zip -d /tmp/deploy-logs; then
                log_status=downloaded
              fi
            fi

            {
              echo "Deploy diagnostic for commit ${TARGET_SHA}"
              echo "Run ID: ${run_id}"
              echo "Run URL: $(jq -r '.html_url' <<<"$run_json")"
              echo "Status: $(jq -r '.status' <<<"$run_json")"
              echo "Conclusion: $(jq -r '.conclusion' <<<"$run_json")"
              echo "Logs: ${log_status}"
              echo
              echo "Jobs and steps:"
              jq -r '.jobs[] | "JOB: \(.name) [\(.status)/\(.conclusion)]\n" + ([.steps[]? | "  STEP: \(.name) [\(.status)/\(.conclusion)]"] | join("\n"))' <<<"$jobs_json"
              echo
              echo "Sanitized error excerpts:"
              if [[ "$log_status" == downloaded ]]; then
                grep -R -i -E -n -C 3 '(^|[^a-z])(error|failed|failure|fatal|invalid|exception|not found|unknown argument|unexpected field|permission|unauthorized|forbidden)([^a-z]|$)' /tmp/deploy-logs \
                  | sed -E 's/(token|password|secret|authorization|api[_ -]?key)[=: ]+[^ ]+/\1=[REDACTED]/Ig' \
                  | head -n 500 || true
              else
                cat /tmp/log-download-error.txt 2>/dev/null || true
              fi
            } > "_diagnostics/deploy-${TARGET_SHA}.txt"
          fi

      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _diagnostics/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: capture current deploy diagnostics'
          git push origin HEAD:main
