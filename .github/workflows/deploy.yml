name: Validate and Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.3.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Validate source, form, provider boundaries, API, and tests
        run: bun run ci

      - name: Deploy existing Worker only
        uses: cloudflare/wrangler-action@a61fbea3226347cc885c6d1b26b3f47b48e6c0f8
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          wranglerVersion: 4.113.0
          command: deploy
