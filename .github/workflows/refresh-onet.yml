# One-shot verification of the scheduled refresh repair.
name: Refresh O*NET Data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-onet.yml'
  workflow_dispatch:
    inputs:
      force:
        description: Re-import even when the detected release is already active
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

concurrency:
  group: onet-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Validate form, provider boundaries, importer, API, and tests
        run: bun run ci

      - name: Verify Cloudflare data-refresh credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Repository or production-environment secret CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Repository or production-environment secret CLOUDFLARE_ACCOUNT_ID is not configured."
            exit 1
          fi

      - name: Detect release, then transform, validate, import, and activate only when changed
        shell: bash
        run: |
          set -o pipefail
          mkdir -p dist/onet
          bun run data:refresh:remote 2>&1 | tee dist/onet/import-console.log
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ONET_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
          ONET_MAX_ROW_WRITES: "90000"

      - name: Preserve refresh logs, manifests, checksums, and generated SQL
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: onet-refresh-${{ github.run_id }}
          path: dist/onet/
          if-no-files-found: warn
          retention-days: 30
