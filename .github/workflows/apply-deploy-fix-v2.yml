name: Apply and validate deploy repair v2

on:
  push:
    branches: [fix/deploy-pipeline]
    paths:
      - '.github/workflows/apply-deploy-fix-v2.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Apply deterministic source repairs
        run: python .github/scripts/repair_deploy.py

      - name: Verify unsafe assertions were removed
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '[A-Za-z0-9_\]\)]!' --include='*.ts' scripts src test; then
            echo 'A non-null assertion remains after the repair.' >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install

      - name: Run complete validation suite
        run: bun run ci

      - name: Verify Worker bundle without deploying
        run: bunx wrangler deploy --dry-run --outdir dist/dry-run

      - name: Commit validated repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-deploy-fix.yml .github/workflows/apply-deploy-fix-v2.yml
          rm -f .github/scripts/repair_deploy.py
          rm -rf _diagnostics dist/dry-run
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make deploy validation pass'
          git push origin HEAD:fix/deploy-pipeline
