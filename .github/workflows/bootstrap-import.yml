name: Bootstrap validated v3 repository

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-import.yml'

permissions:
  contents: write

concurrency:
  group: bootstrap-v3-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check payload completeness
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          expected=12
          actual=$(find .bootstrap -maxdepth 1 -type f -name 'part-*' 2>/dev/null | wc -l)
          if [ "$actual" -eq "$expected" ]; then
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          else
            echo "Payload incomplete: $actual/$expected parts"
            echo 'complete=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Import validated repository
        if: steps.payload.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* | base64 --decode > /tmp/onet-gpt-api-v3-edge.zip
          echo '6f1d3215df65df2229ba7febe375f11a2acd3262921aa02c1b1c06ed67b4ca31  /tmp/onet-gpt-api-v3-edge.zip' | sha256sum --check
          mkdir -p /tmp/import
          unzip -q /tmp/onet-gpt-api-v3-edge.zip -d /tmp/import
          rsync -a --delete --exclude='.git/' /tmp/import/onet-gpt-api/ ./
          rm -rf .bootstrap .github/workflows/bootstrap-import.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import validated O*NET EDGE v3 scaffold'
          git push origin HEAD:main
